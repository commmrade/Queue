services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: queue
      MARIADB_USER: queue_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    image: queue-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      QUEUE_JWT_SECRET: ${QUEUE_JWT_SECRET:?Set QUEUE_JWT_SECRET in .env}
      QUEUE_COOKIE_SECURE: ${QUEUE_COOKIE_SECURE:-false}
      DATABASE_URL: mysql://queue_app:${DB_PASSWORD:?Set DB_PASSWORD in .env}@mariadb:3306/queue
    expose:
      - "3000"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    image: queue-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  mariadb_data:
